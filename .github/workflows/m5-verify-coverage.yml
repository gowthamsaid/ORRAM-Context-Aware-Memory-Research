name: M5 ORRAM verify explicit postroute STA coverage
on:
  push:
    branches: [main]
    paths: [".github/workflows/m5-verify-coverage.yml", "scripts/m5_evaluate_recheck.py"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download postroute recheck evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p recheck
          gh run download 42155987361 --name orram-m5-postroute-8-42155987361 --dir recheck
          gh run download 42155987361 --name orram-m5-postroute-16-42155987361 --dir recheck
          test -s recheck/8/row/ring24/s11/audit.log
          test -s recheck/16/word/dma_stride/s23/audit.log
      - name: Audit 24 verbose checks and routed timing reports
        run: |
          set -euo pipefail
          python3 scripts/m5_evaluate_recheck.py recheck m5_verified
      - name: Archive independent verification summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orram-m5-coverage-verification-${{ github.run_id }}
          path: m5_verified/
          retention-days: 90
