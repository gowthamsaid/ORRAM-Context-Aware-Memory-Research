name: Registered ORRAM integration smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/registered-integration.yml"
      - "scripts/registered_smoke.tcl"
      - "scripts/make_registered_wrapper.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
env:
  ORFS_REV: d056a2b304182bf76ff10653531165b1dd9848d4
  ORFS_IMAGE: openroad/orfs@sha256:641c6870a2c64143464d46017dd25ab647900fd29dce502230a2db0682e69bc9

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download original physical gates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p archive archive_audit wrapper integration
          gh run download 42053883466 --name orram-feasibility-42053883466 --dir archive
          gh run download 42066620647 --name milestone1-model-audit-42066620647 --dir archive_audit
          for arch in row word; do
            test -s "archive_audit/$arch/ram_structural.v"
            mkdir -p "archive/results/$arch"
            cp "archive_audit/$arch/ram_structural.v" "archive/results/$arch/ram_structural.v"
          done
          python3 scripts/make_registered_wrapper.py balanced wrapper/balanced.v
          python3 scripts/make_registered_wrapper.py late_low wrapper/late_low.v
          python3 -m py_compile scripts/make_registered_wrapper.py
      - name: Pin physical design environment
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none https://github.com/The-OpenROAD-Project/OpenROAD-flow-scripts.git /tmp/orfs
          git -C /tmp/orfs checkout -q "$ORFS_REV"
          docker pull -q "$ORFS_IMAGE"
      - name: Implement first balanced registered pilot (no route yet)
        run: |
          set -euo pipefail
          mkdir -p integration/row/balanced
          docker run --rm --user "$(id -u):$(id -g)" \
            -v /tmp/orfs/flow:/OpenROAD-flow-scripts/flow \
            -v "$PWD:/study" -w /OpenROAD-flow-scripts/flow \
            -e ORRAM_VARIANT=row -e ORRAM_WRAPPER=balanced \
            -e ORRAM_INTEGRATION_OUT=/study/integration/row/balanced \
            -e ORRAM_SEED=1 "$ORFS_IMAGE" \
            bash -lc 'source ../env.sh && openroad -exit /study/scripts/registered_smoke.tcl' \
            > integration/row/balanced/console.log 2>&1 || {
              tail -n 120 integration/row/balanced/console.log
              exit 1
            }
          test -s integration/row/balanced/read_reg_to_reg.rpt
          cat integration/row/balanced/seed_status.txt
      - name: Archive diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registered-integration-smoke-${{ github.run_id }}
          path: |
            integration/
            wrapper/
          if-no-files-found: warn
          retention-days: 90
