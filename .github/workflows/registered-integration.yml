name: Matched registered ORRAM physical comparison

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
env:
  ORFS_REV: d056a2b304182bf76ff10653531165b1dd9848d4
  ORFS_IMAGE: openroad/orfs@sha256:641c6870a2c64143464d46017dd25ab647900fd29dce502230a2db0682e69bc9

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Download original physical gates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p archive archive_audit wrapper integration
          gh run download 42053883466 --name orram-feasibility-42053883466 --dir archive
          gh run download 42066620647 --name milestone1-model-audit-42066620647 --dir archive_audit
          for arch in row word; do
            test -s "archive_audit/$arch/ram_structural.v"
            mkdir -p "archive/results/$arch"
            cp "archive_audit/$arch/ram_structural.v" "archive/results/$arch/ram_structural.v"
          done
          python3 scripts/make_registered_wrapper.py balanced wrapper/balanced.v
          python3 scripts/make_registered_wrapper.py late_low wrapper/late_low.v
          python3 -m py_compile scripts/make_registered_wrapper.py
      - name: Pin physical design environment
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none https://github.com/The-OpenROAD-Project/OpenROAD-flow-scripts.git /tmp/orfs
          git -C /tmp/orfs checkout -q "$ORFS_REV"
          docker pull -q "$ORFS_IMAGE"
      - name: Matched placement of four registered architectures
        run: |
          set -euo pipefail
          for arch in row word; do
            for mode in balanced late_low; do
              folder="integration/$arch/$mode"
              mkdir -p "$folder"
              docker run --rm --user "$(id -u):$(id -g)" \
                -v /tmp/orfs/flow:/OpenROAD-flow-scripts/flow \
                -v "$PWD:/study" -w /OpenROAD-flow-scripts/flow \
                -e ORRAM_VARIANT="$arch" -e ORRAM_WRAPPER="$mode" \
                -e ORRAM_INTEGRATION_OUT="/study/$folder" \
                -e ORRAM_SEED=1 "$ORFS_IMAGE" \
                bash -lc 'source ../env.sh && openroad -exit /study/scripts/registered_smoke.tcl' \
                > "$folder/placement.log" 2>&1 || {
                  tail -n 150 "$folder/placement.log"
                  exit 1
                }
              test -s "$folder/read_reg_to_reg.rpt"
              cat "$folder/seed_status.txt"
            done
          done
      - name: Global and detailed routing plus extracted SPEF reimport
        run: |
          set -euo pipefail
          for arch in row word; do
            for mode in balanced late_low; do
              folder="integration/$arch/$mode"
              docker run --rm --user "$(id -u):$(id -g)" \
                -v /tmp/orfs/flow:/OpenROAD-flow-scripts/flow \
                -v "$PWD:/study" -w /OpenROAD-flow-scripts/flow \
                -e ORRAM_VARIANT="$arch" -e ORRAM_WRAPPER="$mode" \
                "$ORFS_IMAGE" \
                bash -lc 'source ../env.sh && openroad -exit /study/scripts/routed_integration.tcl' \
                > "$folder/routing.log" 2>&1 || {
                  tail -n 150 "$folder/routing.log"
                  exit 1
                }
              test -s "$folder/routed_read_path.rpt"
              test -s "$folder/routed.spef"
            done
          done
      - name: Cross-architecture physical measurement
        run: |
          set -euo pipefail
          python3 scripts/parse_registered_comparison.py integration
          cat integration/cross_comparison/summary.json
      - name: Archive diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registered-integration-smoke-${{ github.run_id }}
          path: |
            integration/
            wrapper/
          if-no-files-found: warn
          retention-days: 90
